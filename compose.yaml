services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memorybox
      POSTGRES_PASSWORD: memorybox-local
      POSTGRES_DB: memorybox
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - memorybox-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U memorybox"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  memorybox-db:
